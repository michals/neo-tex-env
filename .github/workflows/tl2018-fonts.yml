name: Build and Push tl2018-fonts

on:
  push:
    branches: [ master ]
    paths:
      - 'src/tl2018-fonts/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/neo-tex-env:tl2018-fonts \
            -f src/tl2018-fonts/Dockerfile \
            src/tl2018-fonts

      - name: Push to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/neo-tex-env:tl2018-fonts

